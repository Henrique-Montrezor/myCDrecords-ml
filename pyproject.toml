[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mycdrecords-ml"
version = "0.1.0"
description = "Isolated synthetic recommendation experiments for myCDrecords"
requires-python = ">=3.14,<3.15"
dependencies = ["torch==2.15.0", "numpy==2.4.4"]

[tool.setuptools.packages.find]
include = ["mycdrecords_ml*"]
